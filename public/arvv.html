<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARVV — Rina Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff7fa,
                    #fffdf5
                );

            color: #4f4147;
        }


        .container {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;
        }


        header {
            margin-bottom: 30px;
        }


        h1 {
            margin: 0;

            color: #c96f91;

            font-size: 32px;
        }


        .subtitle {
            margin-top: 8px;

            color: #806d75;
        }


        /* =====================================================
           SUMMARY CARDS
        ===================================================== */

        .summary {
            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    1fr
                );

            gap: 20px;

            margin-bottom: 30px;
        }


        .summary-card {

            background: white;

            padding: 25px;

            border-radius: 20px;

            border:
                1px solid #f2dce5;

            box-shadow:
                0 8px 25px
                rgba(
                    180,
                    120,
                    140,
                    0.10
                );
        }


        .summary-label {

            font-size: 14px;

            color: #927983;

            margin-bottom: 10px;
        }


        .summary-number {

            font-size: 34px;

            font-weight: bold;

            color: #c96f91;
        }


        /* =====================================================
           SECTIONS
        ===================================================== */

        .section {

            background: white;

            padding: 25px;

            margin-bottom: 30px;

            border-radius: 20px;

            border:
                1px solid #f2dce5;

            box-shadow:
                0 8px 25px
                rgba(
                    180,
                    120,
                    140,
                    0.08
                );
        }


        .section h2 {

            margin-top: 0;

            color: #c96f91;
        }


        /* =====================================================
           VISIT TABLE
        ===================================================== */

        .table-wrapper {

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse:
                collapse;
        }


        th {

            text-align: left;

            padding: 12px;

            background:
                #fff3f7;

            color:
                #a95e7c;
        }


        td {

            padding: 12px;

            border-bottom:
                1px solid #f3e4e9;

            font-size: 14px;
        }


        tr:hover td {

            background:
                #fffafd;
        }


        .visitor {

            font-family:
                monospace;

            font-size: 12px;

            color:
                #8b727c;
        }


        /* =====================================================
           ANSWER CARDS
        ===================================================== */

        .answer-card {

            border:
                1px solid #f0dce4;

            border-radius:
                16px;

            padding:
                20px;

            margin-bottom:
                20px;

            background:
                #fffafd;
        }


        .answer-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap: 15px;

            margin-bottom:
                15px;

            flex-wrap: wrap;
        }


        .answer-title {

            font-size:
                18px;

            font-weight:
                bold;

            color:
                #c96f91;
        }


        .answer-date {

            font-size:
                13px;

            color:
                #927983;
        }


        .visitor-id {

            font-family:
                monospace;

            font-size:
                11px;

            color:
                #9a818a;

            margin-bottom:
                15px;

            word-break:
                break-all;
        }


        .answer-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap:
                12px;
        }


        .answer-item {

            background:
                white;

            padding:
                14px;

            border-radius:
                12px;

            border:
                1px solid #f2e2e8;
        }


        .answer-label {

            display:
                block;

            font-size:
                12px;

            color:
                #a27d8c;

            margin-bottom:
                5px;

            font-weight:
                bold;
        }


        .answer-value {

            display:
                block;

            font-size:
                15px;

            color:
                #51434a;

            white-space:
                pre-wrap;

            word-break:
                break-word;
        }


        .empty {

            padding:
                30px;

            text-align:
                center;

            color:
                #927983;
        }


        /* =====================================================
           REFRESH
        ===================================================== */

        .top-actions {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

            flex-wrap:
                wrap;
        }


        .refresh-btn {

            border:
                none;

            background:
                #c96f91;

            color:
                white;

            padding:
                12px 20px;

            border-radius:
                12px;

            cursor:
                pointer;

            font-size:
                14px;

            font-weight:
                bold;
        }


        .refresh-btn:hover {

            opacity:
                0.9;
        }


        .loading {

            color:
                #927983;

            padding:
                15px 0;
        }


        .error {

            background:
                #fff0f0;

            color:
                #b64d4d;

            padding:
                15px;

            border-radius:
                12px;

            margin-bottom:
                20px;

            display:
                none;
        }


        /* =====================================================
           MOOD CARDS
        ===================================================== */

        .mood-card {

            border:
                1px solid #f0dce4;

            border-radius:
                16px;

            padding:
                20px;

            margin-bottom:
                15px;

            background:
                #fffafd;
        }


        .mood-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

            flex-wrap:
                wrap;

            margin-bottom:
                10px;
        }


        .mood-title {

            font-size:
                20px;

            font-weight:
                bold;

            color:
                #c96f91;
        }


        .mood-date {

            font-size:
                13px;

            color:
                #927983;
        }


        .mood-stars {

            font-size:
                25px;

            letter-spacing:
                3px;

            color:
                #d26b91;

            margin:
                8px 0;
        }


        .mood-rating-text {

            font-size:
                15px;

            color:
                #66575d;
        }


        .mood-visitor {

            margin-top:
                10px;

            font-family:
                monospace;

            font-size:
                11px;

            color:
                #9a818a;

            word-break:
                break-all;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .summary {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }


            h1 {
                font-size: 25px;
            }


            .summary {

                grid-template-columns:
                    1fr;
            }


            .answer-grid {

                grid-template-columns:
                    1fr;
            }


            .section {

                padding: 18px;
            }


            .summary-card {

                padding: 20px;
            }


            .mood-card {

                padding: 16px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="top-actions">

            <div>

                <h1>
                    🌻 ARVV Dashboard
                </h1>

                <div class="subtitle">
                    Rina's questionnaire activity
                </div>

            </div>


            <button
                class="refresh-btn"
                onclick="loadDashboard()"
            >
                Refresh ↻
            </button>

        </div>

    </header>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
        id="error"
        class="error"
    ></div>


    <!-- =====================================================
         SUMMARY
    ====================================================== -->

    <div class="summary">


        <!-- TOTAL PAGE OPENS -->

        <div class="summary-card">

            <div class="summary-label">
                Total Page Opens
            </div>

            <div
                class="summary-number"
                id="totalVisits"
            >
                —
            </div>

        </div>


        <!-- UNIQUE BROWSERS -->

        <div class="summary-card">

            <div class="summary-label">
                Unique Browsers
            </div>

            <div
                class="summary-number"
                id="uniqueVisitors"
            >
                —
            </div>

        </div>


        <!-- QUESTIONNAIRE SUBMISSIONS -->

        <div class="summary-card">

            <div class="summary-label">
                Questionnaire Submissions
            </div>

            <div
                class="summary-number"
                id="totalSubmissions"
            >
                —
            </div>

        </div>


        <!-- MOOD RATINGS -->

        <div class="summary-card">

            <div class="summary-label">
                Mood Ratings
            </div>

            <div
                class="summary-number"
                id="totalMoods"
            >
                —
            </div>

        </div>

    </div>


    <!-- =====================================================
         MOOD RATINGS
    ====================================================== -->

    <div class="section">

        <h2>
            🌷 Rina's Mood Today
        </h2>


        <div
            id="moodsLoading"
            class="loading"
        >
            Loading mood ratings...
        </div>


        <div
            id="moodsContainer"
        ></div>

    </div>


    <!-- =====================================================
         PAGE VISITS
    ====================================================== -->

    <div class="section">

        <h2>
            👀 Page Open History
        </h2>


        <div
            id="visitsLoading"
            class="loading"
        >
            Loading visits...
        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Date / Time
                        </th>

                        <th>
                            Visitor
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="visitsTable"
                ></tbody>

            </table>

        </div>

    </div>


    <!-- =====================================================
         QUESTIONNAIRE ANSWERS
    ====================================================== -->

    <div class="section">

        <h2>
            💌 Questionnaire Answers
        </h2>


        <div
            id="answersLoading"
            class="loading"
        >
            Loading answers...
        </div>


        <div
            id="answersContainer"
        ></div>

    </div>


</div>


<script>


    // ========================================================
    // FORMAT DATE
    // ========================================================

    function formatDate(dateString) {

        if (!dateString) {

            return "Unknown";

        }


        const date =
            new Date(dateString);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return dateString;

        }


        return date.toLocaleString(
            undefined,
            {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    }


    // ========================================================
    // ESCAPE HTML
    // ========================================================

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    // ========================================================
    // GET MOOD INFORMATION
    // ========================================================

    function getMoodInfo(mood) {

        const moods = {

            angry: {
                emoji: "😡",
                name: "Angry"
            },

            sad: {
                emoji: "😢",
                name: "Sad"
            },

            okay: {
                emoji: "😐",
                name: "Okay"
            },

            happy: {
                emoji: "😊",
                name: "Happy"
            },

            very_happy: {
                emoji: "🥰",
                name: "Very Happy"
            }

        };


        return (
            moods[mood] || {
                emoji: "🌷",
                name: mood || "Unknown Mood"
            }
        );

    }


    // ========================================================
    // LOAD DASHBOARD
    // ========================================================

    async function loadDashboard() {

        const error =
            document.getElementById(
                "error"
            );


        error.style.display =
            "none";


        document.getElementById(
            "visitsLoading"
        ).style.display =
            "block";


        document.getElementById(
            "answersLoading"
        ).style.display =
            "block";


        document.getElementById(
            "moodsLoading"
        ).style.display =
            "block";


        try {

            const response =
                await fetch(
                    "/api/admin/dashboard"
                );


            if (!response.ok) {

                throw new Error(
                    "Server returned " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.message ||
                    "Failed to load dashboard"
                );

            }


            // =================================================
            // SUMMARY
            // =================================================

            document.getElementById(
                "totalVisits"
            ).textContent =
                data.summary.totalVisits;


            document.getElementById(
                "uniqueVisitors"
            ).textContent =
                data.summary.uniqueVisitors;


            document.getElementById(
                "totalSubmissions"
            ).textContent =
                data.summary.totalSubmissions;


            document.getElementById(
                "totalMoods"
            ).textContent =
                data.summary.totalMoods || 0;


            // =================================================
            // VISITS
            // =================================================

            renderVisits(
                data.visits
            );


            // =================================================
            // ANSWERS
            // =================================================

            renderAnswers(
                data.answers
            );


            // =================================================
            // MOODS
            // =================================================

            renderMoods(
                data.moods
            );


        } catch (error) {

            console.error(
                "DASHBOARD ERROR:",
                error
            );


            document.getElementById(
                "error"
            ).textContent =
                "Could not load dashboard: " +
                error.message;


            document.getElementById(
                "error"
            ).style.display =
                "block";


            document.getElementById(
                "visitsLoading"
            ).style.display =
                "none";


            document.getElementById(
                "answersLoading"
            ).style.display =
                "none";


            document.getElementById(
                "moodsLoading"
            ).style.display =
                "none";

        }

    }


    // ========================================================
    // RENDER VISITS
    // ========================================================

    function renderVisits(visits) {

        const loading =
            document.getElementById(
                "visitsLoading"
            );


        const table =
            document.getElementById(
                "visitsTable"
            );


        loading.style.display =
            "none";


        table.innerHTML =
            "";


        if (
            !visits ||
            visits.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="empty"
                    >
                        No page visits yet.
                    </td>

                </tr>

            `;

            return;

        }


        visits.forEach(
            (visit, index) => {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>


                    <td>
                        ${escapeHTML(
                            formatDate(
                                visit.visited_at
                            )
                        )}
                    </td>


                    <td class="visitor">
                        ${escapeHTML(
                            visit.visitor_id
                        )}
                    </td>

                `;


                table.appendChild(
                    row
                );

            }
        );

    }


    // ========================================================
    // RENDER MOODS
    // ========================================================

    function renderMoods(moods) {

        const loading =
            document.getElementById(
                "moodsLoading"
            );


        const container =
            document.getElementById(
                "moodsContainer"
            );


        loading.style.display =
            "none";


        container.innerHTML =
            "";


        if (
            !moods ||
            moods.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">
                    No mood ratings yet. 🌷
                </div>

            `;

            return;

        }


        moods.forEach(
            (mood, index) => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "mood-card";


                const moodInfo =
                    getMoodInfo(
                        mood.mood
                    );


                const rating =
                    Number(
                        mood.rating
                    );


                const safeRating =
                    Math.max(
                        0,
                        Math.min(
                            5,
                            rating
                        )
                    );


                const stars =
                    "★".repeat(
                        safeRating
                    ) +

                    "☆".repeat(
                        5 -
                        safeRating
                    );


                card.innerHTML = `

                    <div class="mood-header">

                        <div class="mood-title">

                            ${moodInfo.emoji}

                            ${escapeHTML(
                                moodInfo.name
                            )}

                        </div>


                        <div class="mood-date">

                            ${escapeHTML(
                                formatDate(
                                    mood.submitted_at
                                )
                            )}

                        </div>

                    </div>


                    <div class="mood-stars">

                        ${stars}

                    </div>


                    <div class="mood-rating-text">

                        Rating:

                        <strong>
                            ${rating}/5
                        </strong>

                    </div>


                    <div class="mood-visitor">

                        Visitor ID:

                        ${escapeHTML(
                            mood.visitor_id
                        )}

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }


    // ========================================================
    // RENDER ANSWERS
    // ========================================================

    function renderAnswers(answers) {

        const loading =
            document.getElementById(
                "answersLoading"
            );


        const container =
            document.getElementById(
                "answersContainer"
            );


        loading.style.display =
            "none";


        container.innerHTML =
            "";


        if (
            !answers ||
            answers.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">
                    No questionnaire answers yet. 🌻
                </div>

            `;

            return;

        }


        answers.forEach(
            (submission, index) => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "answer-card";


                const response =
                    submission.response ||
                    {};


                const keys =
                    Object.keys(
                        response
                    );


                let answerHTML =
                    "";


                keys.forEach(
                    key => {

                        const value =
                            response[key];


                        if (
                            value === null ||
                            value === undefined ||
                            value === ""
                        ) {

                            return;

                        }


                        answerHTML += `

                            <div
                                class="answer-item"
                            >

                                <span
                                    class="answer-label"
                                >

                                    ${escapeHTML(
                                        key
                                    )}

                                </span>


                                <span
                                    class="answer-value"
                                >

                                    ${escapeHTML(
                                        value
                                    )}

                                </span>

                            </div>

                        `;

                    }
                );


                card.innerHTML = `

                    <div
                        class="answer-header"
                    >

                        <div
                            class="answer-title"
                        >

                            💌 Submission #${
                                index + 1
                            }

                        </div>


                        <div
                            class="answer-date"
                        >

                            ${escapeHTML(
                                formatDate(
                                    submission.submitted_at
                                )
                            )}

                        </div>

                    </div>


                    <div
                        class="visitor-id"
                    >

                        Visitor ID:

                        ${escapeHTML(
                            submission.visitor_id
                        )}

                    </div>


                    <div
                        class="answer-grid"
                    >

                        ${
                            answerHTML ||

                            `

                            <div class="empty">
                                No answer data.
                            </div>

                            `
                        }

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }


    // ========================================================
    // START DASHBOARD
    // ========================================================

    loadDashboard();


</script>

</body>

</html>
